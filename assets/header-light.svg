<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="Yamas, Full Stack Agentic AI Engineer"><title>Yamas, Full Stack Agentic AI Engineer</title><style>
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{fill-opacity:0}}
.dot{animation:dot 2.4s ease-in-out infinite;transform-origin:56px 59px}
@keyframes dot{0%,100%{opacity:1}50%{opacity:.35}}
.pulse{animation:run 6.0s linear infinite}
@keyframes run{0%{transform:translateX(0);opacity:0}4%{opacity:1}82%{transform:translateX(820px);opacity:1}88%,100%{transform:translateX(820px);opacity:0}}
.trail{stroke-dasharray:820;stroke-dashoffset:820;animation:trail 6.0s linear infinite}
@keyframes trail{0%{stroke-dashoffset:820;opacity:1}82%{stroke-dashoffset:0;opacity:1}90%,100%{stroke-dashoffset:0;opacity:0}}
.node{animation:lit 6.0s linear infinite}
@keyframes lit{0%{fill:#b86a00}10%,100%{fill:#ffffff}}
.ln{animation:ln 9s ease-out infinite both}
@keyframes ln{0%{opacity:0;transform:translateY(4px)}4%{opacity:1;transform:none}80%{opacity:1}88%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.blink,.dot,.pulse,.trail,.node,.ln{animation:none}.trail{stroke-dashoffset:0}}
